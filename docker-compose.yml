services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tts
      POSTGRES_USER: tts
      POSTGRES_PASSWORD: tts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      TTS_DATABASE_URL: postgresql+psycopg://tts:tts@postgres:5432/tts
      TTS_VOICES_DIR: /data/voices
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./voices:/data/voices
      - ./model_cache:/root/.local/share/tts

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
